<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">

<style>
/* ===== 项目设计 Token（来自 src/index.css）===== */
:root {
  --color-primary: #1d4ed8; --color-primary-hover: #1e40af;
  --color-accent: #0d9488; --color-accent-hover: #0f766e;
  --color-accent-light: #f0fdfa;
  --color-title: #0f172a; --color-text: #334155;
  --color-text-secondary: #64748b; --color-text-placeholder: #94a3b8;
  --neutral-text-01: #000; --neutral-text-02: #666;
  --neutral-text-03: #999; --neutral-text-04: #b3b3b3; --neutral-text-05: #ccc;
  --neutral-divider-01: #e5e5e5; --neutral-divider-02: #eaeaea; --neutral-divider-03: #f3f3f3;
  --neutral-bg-01: #eaeaea; --neutral-bg-02: #f3f3f3; --neutral-bg-03: #f9f9f9;
  --color-border: #eaeaea; --color-bg: #f9f9f9; --color-bg-card: #fff;
  --color-success: #059669; --color-success-bg: #ecfdf5;
  --color-warning: #d97706; --color-warning-bg: #fffbeb;
  --color-danger: #dc2626; --color-danger-bg: #fef2f2;
  --color-info: #2563eb; --color-info-bg: #eff6ff;
  --font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --layout-sidebar-width: 240px; --layout-header-height: 56px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-base: 16px; --sp-lg: 24px; --sp-xl: 32px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-family);font-size:14px;line-height:20px;color:var(--color-text);background:var(--color-bg)}
/* === 组件类（对齐项目代码）=== */
.geo-card{background:var(--color-bg-card);border:1px solid var(--neutral-divider-02);border-radius:var(--radius-lg)}
.geo-btn-primary{display:inline-flex;align-items:center;justify-content:center;background:var(--color-accent);color:#fff;border:1px solid transparent;border-radius:var(--radius-md);font-size:14px;line-height:20px;padding:10px 20px;min-height:40px;cursor:pointer;font-family:inherit;transition:background .2s}
.geo-btn-primary:hover{background:var(--color-accent-hover)}
.geo-btn-primary:disabled{opacity:.5;cursor:not-allowed}
.geo-btn-secondary{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--color-text);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:14px;line-height:20px;padding:10px 20px;min-height:40px;cursor:pointer;font-family:inherit;transition:all .2s}
.geo-btn-secondary:hover{border-color:var(--neutral-divider-01);background:var(--neutral-bg-01)}
.geo-btn-sm{min-height:36px;padding:8px 18px;font-size:13px}
.geo-btn-xs{min-height:32px;padding:6px 16px;font-size:12px}
.geo-btn-danger{display:inline-flex;align-items:center;justify-content:center;background:var(--color-danger);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;padding:10px 20px;min-height:40px;cursor:pointer;font-family:inherit}
.geo-nav-active{background:var(--color-primary);color:#fff;border-radius:var(--radius-md)}
.geo-nav-item{color:var(--neutral-text-02);transition:background .15s}
.geo-nav-item:hover{background:var(--neutral-bg-01)}
.geo-input{width:100%;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:14px;font-family:inherit;color:var(--color-text);background:#fff;outline:none;transition:border-color .15s}
.geo-input:focus{border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-light)}
.geo-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.geo-badge-accent{background:var(--color-accent-light);color:var(--color-accent)}
.geo-badge-warning{background:var(--color-warning-bg);color:var(--color-warning)}
.geo-badge-info{background:var(--color-info-bg);color:var(--color-info)}
.geo-badge-success{background:var(--color-success-bg);color:var(--color-success)}
.geo-badge-muted{background:var(--neutral-bg-02);color:var(--neutral-text-03)}
/* === 壳层布局 === */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--layout-sidebar-width);background:var(--neutral-bg-03);border-right:1px solid var(--neutral-divider-02);position:fixed;top:0;left:0;bottom:0;z-index:20;display:flex;flex-direction:column}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--layout-header-height);border-bottom:1px solid var(--neutral-divider-02);flex-shrink:0}
.sidebar-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.sidebar-brand-name{font-size:13px;font-weight:700;color:var(--neutral-text-01)}
.sidebar-nav{flex:1;padding:8px 12px;overflow-y:auto}
.sidebar-nav button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-md);font-size:13px;cursor:pointer;border:none;background:none;font-family:inherit;text-align:left;min-height:36px}
.sidebar-section-label{padding:8px 12px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--neutral-text-04)}
.sidebar-footer{border-top:1px solid var(--neutral-divider-02);padding:12px 16px;font-size:11px;color:var(--neutral-text-03);flex-shrink:0}
.header{height:var(--layout-header-height);position:fixed;top:0;left:var(--layout-sidebar-width);right:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--neutral-divider-02);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header-left{display:flex;align-items:center;gap:12px}
.header-title{font-size:18px;font-weight:700;color:var(--neutral-text-01)}
.header-brand{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--neutral-text-02)}
.header-brand-select{padding:4px 8px;border:1px solid var(--color-border);border-radius:6px;font-size:12px;color:var(--color-text);background:#fff;cursor:pointer;font-family:inherit}
.header-right{display:flex;align-items:center;gap:12px}
.header-avatar{width:32px;height:32px;border-radius:50%;background:var(--neutral-text-01);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.page-content{margin-left:var(--layout-sidebar-width);padding-top:var(--layout-header-height);min-height:100vh}
.page-content-inner{padding:var(--sp-xl)}
/* === 导航 Tab === */
.nav-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.nav-tab{padding:6px 14px;border-radius:var(--radius-md);font-size:12px;cursor:pointer;border:1px solid var(--color-border);background:#fff;font-family:inherit;color:var(--color-text);transition:all .15s}
.nav-tab.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
/* === 表格 === */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:12px 16px;text-align:left;font-weight:600;font-size:12px;color:var(--neutral-text-01);background:var(--neutral-bg-02);border-bottom:1px solid var(--neutral-divider-02)}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--neutral-divider-02);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--neutral-bg-02)}
/* === 工具 === */
.section-title{font-size:16px;font-weight:600;color:var(--color-title);margin-bottom:12px}
.form-section-title{font-size:14px;font-weight:600;color:var(--color-title);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--neutral-divider-02)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-full{grid-template-columns:1fr}
.form-label{font-size:12px;color:var(--neutral-text-03);margin-bottom:4px;display:block}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px;border-radius:var(--radius-md);font-size:12px;cursor:pointer;border:1px solid var(--color-border);background:#fff;color:var(--color-text);transition:all .15s}
.chip.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.stat-card{background:var(--neutral-bg-02);border-radius:var(--radius-md);padding:12px 16px}
.stat-label{font-size:11px;color:var(--neutral-text-03)}
.stat-value{font-size:18px;font-weight:700;color:var(--color-title);margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task-card{border:1px solid var(--neutral-divider-02);border-radius:var(--radius-xl);padding:16px;display:flex;flex-direction:column;gap:8px}
.task-card-title{font-size:14px;font-weight:600;color:var(--color-title)}
.task-card-status{font-size:12px;color:var(--color-accent)}
.task-card-summary{font-size:12px;color:var(--neutral-text-03)}
.task-card-action{font-size:12px;color:var(--color-accent);cursor:pointer;font-weight:500;background:none;border:none;text-align:left;padding:0;font-family:inherit}
.progress-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.progress-step{padding:6px 12px;border-radius:20px;font-size:12px;background:var(--neutral-bg-02);color:var(--neutral-text-03)}
.progress-step.active{background:var(--color-accent);color:#fff}
.progress-step.done{background:var(--color-success-bg);color:var(--color-success)}
.progress-arrow{color:var(--neutral-text-04);font-size:12px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.text-accent{color:var(--color-accent)}.text-muted{color:var(--neutral-text-03)}
.text-xs{font-size:12px}.text-sm{font-size:13px}.text-lg{font-size:16px}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.btn-link{background:none;border:none;color:var(--color-accent);font-size:12px;cursor:pointer;font-family:inherit;padding:0}
/* === 页面切换导航 === */
.page-nav{position:fixed;bottom:16px;right:16px;z-index:50;background:var(--color-bg-card);border:1px solid var(--neutral-divider-02);border-radius:var(--radius-lg);padding:8px;display:flex;flex-direction:column;gap:4px;max-height:400px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.page-nav button{text-align:left;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;border:none;background:none;font-family:inherit;white-space:nowrap}
.page-nav button:hover{background:var(--neutral-bg-02)}
.page-nav button.active{background:var(--color-primary);color:#fff}
/* 隐藏所有页面，只显示 active */
.page-panel{display:none}
.page-panel.active{display:block}
</style>
</head>

<div class="app-shell">
  <!-- ====== 统一 Sidebar ====== -->

</div>

<div class="page-nav" id="pageNav"></div>

// ===== 页面切换逻辑 =====
function switchPage(name) {
  if (!PAGES[name]) return;
  const p = PAGES[name];
  document.getElementById('pageTitle').textContent = p.title;
  document.getElementById('pageContainer').innerHTML = p.html;
  // 更新导航高亮
  document.querySelectorAll('.page-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  // 更新 sidebar 高亮（简化：仅工作台高亮）
  document.querySelectorAll('.sidebar-nav button').forEach(b => {
    const isActive = (name === 'workbench' && b.textContent.includes('工作台')) ||
                     (name.startsWith('publish') && b.textContent.includes('付费信源')) ||
                     (name === 'task-list' && b.textContent.includes('付费信源')) ||
                     (name.startsWith('bid') && b.textContent.includes('付费信源')) ||
                     (name === 'exec-detail' && b.textContent.includes('付费信源')) ||
                     (name === 'site-optimize' && b.textContent.includes('网站优化')) ||
                     (name === 'new-site' && b.textContent.includes('新建网站'));
    b.className = isActive ? 'geo-nav-active' : 'geo-nav-item';
  });
  window.scrollTo(0, 0);
}

// ===== 初始化导航 =====
function init() {
  const nav = document.getElementById('pageNav');
  const entries = [
    ['workbench','01 工作台'],['publish-form','02 任务发布表单'],['plan-split','03 方案拆单页'],
    ['bid-compare','04 比价页'],['task-list','05 任务管理列表'],['bid-detail','06 报价详情对比'],
    ['exec-detail','07 执行详情'],['task-hall','08 任务大厅(接单)'],['provider-task-detail','09 接单任务详情'],
    ['submit-quote','10 提交报价(接单)'],['provider-onboarding','11 入驻信息提交'],['provider-case-mgmt','12 案例资源维护'],
    ['site-optimize','13 自有网站优化'],['new-site','14 新建网站']
  ];
  entries.forEach(([key,label]) => {
    const btn = document.createElement('button');
    btn.textContent = label; btn.dataset.page = key;
    btn.onclick = () => switchPage(key);
    nav.appendChild(btn);
  });
  switchPage('workbench');
}
init();
</script>
